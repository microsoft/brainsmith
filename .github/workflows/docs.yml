name: Deploy Documentation

on:
  push:
    branches:
      - main
      - develop
  pull_request_target:  # Changed from pull_request for fork security
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    # SECURITY: Only deploy on push to main/develop, not PRs
    # PRs can validate docs build but cannot deploy
    if: github.event_name != 'pull_request_target' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # SECURITY: Check out PR head for validation, not base
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0  # Needed for git-revision-date-localized and mike

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Configure Git
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: 1.8.0
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: |
          # NOTE: Currently installs only docs dependencies (mkdocs, mike, etc.)
          # mkdocstrings is disabled in mkdocs.yml, so brainsmith package not needed
          # --only docs installs just the docs group, skipping main deps (which need deps/ directory)
          # --no-root skips installing brainsmith package itself (which also needs deps/ directory)
          # For November 2025 launch: add ./docker/fetch-repos.sh step and change to: --with docs
          poetry install --only docs --no-root

      - name: Deploy stable version (main branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          poetry run mike deploy --push --update-aliases stable latest
          poetry run mike set-default --push latest

      - name: Deploy dev version (develop branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          # Deploy develop branch as "dev" version only
          # The main branch handles "latest" alias and default page

          # Delete existing versions to force fresh deployment (prevents "nothing changed" errors)
          poetry run mike delete --push dev 2>/dev/null || echo "No existing dev version to delete"

          # Deploy dev version (no "latest" alias - that's for main branch)
          poetry run mike deploy --push dev
